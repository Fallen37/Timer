<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task Screensaver - Home</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e2f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 30px;
    }

    .clock {
      font-size: 80px;
      letter-spacing: 8px;
      margin-bottom: 60px;
      font-family: 'Courier New', Courier, monospace;
    }

    .btn {
      background-color: #3e8ed0;
      color: white;
      padding: 15px 30px;
      font-size: 20px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #5ea1de;
    }
  </style>
</head>
<body>
  <h1>Welcome</h1>
  <div class="clock" id="clock">--:--</div>

  <button class="btn" onclick="goTo('screensaver')">Screensaver Mode</button>
  <button class="btn" onclick="goTo('task')">Task Mode</button>

  <script>
    function updateClock() {
      const clock = document.getElementById("clock");
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      clock.textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function goTo(mode) {
      window.location.href = `${mode}.html`;
    }
  </script>
</body>
</html>
